<!DOCTYPE html>
<html>
<head><title>Fetch Test</title></head>
<body>
<pre id="out">Running fetch test...</pre>
<script>
async function run() {
  try {
    const url = '/api/media-data/sample_event_schedule.pdf';
    const res = await fetch(url);
    const buf = await res.arrayBuffer();
    const headers = {};
    for (const [k, v] of res.headers.entries()) {
      headers[k] = v;
    }
    const result = {
      status: res.status,
      statusText: res.statusText,
      byteLength: buf.byteLength,
      headers: headers
    };
    document.getElementById('out').textContent = JSON.stringify(result, null, 2);
  } catch (err) {
    document.getElementById('out').textContent = 'Error: ' + err.message + '\n' + err.stack;
  }
}
run();
</script>
</body>
</html>
