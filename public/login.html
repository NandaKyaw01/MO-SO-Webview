<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Digital Signage</title>
  <link rel="stylesheet" href="/login.css">
</head>

<body>

  <!-- Ambient Glowing Background Elements -->
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
  <div class="bg-grid"></div>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-card">
      <div class="card-top-accent"></div>

      <!-- Card Header -->
      <div class="card-header">
        <div class="brand-badge-wrap">
          <div class="brand-icon">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125z" />
            </svg>
            <span class="brand-status-dot" title="Signage Network Active"></span>
          </div>
        </div>
        <h1 class="login-title">Digital Signage</h1>
        <p class="login-subtitle">Sign in to access the Admin Control Dashboard</p>
      </div>

      <!-- Error Alert Banner -->
      <div class="alert-banner" id="login-alert" role="alert">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
        <span id="alert-text">Invalid username or password</span>
      </div>

      <!-- Login Form -->
      <form class="login-form" id="login-form" autocomplete="on">

        <!-- Username Field -->
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter admin username"
              autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter password"
              autocomplete="current-password" required>
            <button type="button" class="btn-toggle-pw" id="btn-toggle-pw" title="Toggle password visibility"
              aria-label="Toggle password visibility">
              <svg id="pw-eye-icon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Options Row -->
        <div class="form-options">
          <label class="remember-label">
            <input type="checkbox" id="remember-me" class="custom-checkbox" checked>
            <span>Remember me</span>
          </label>
          <span class="session-info-badge">7-Day Session</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit" class="btn-submit">
          <span class="btn-text">Sign In to Dashboard</span>
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
          <div class="spinner" id="btn-spinner"></div>
        </button>

      </form>

      <!-- Quick Credential Helper Pill -->
      <!-- <div class="credential-helper-card">
        <div class="helper-text">
          <span class="helper-title">Default Admin Login</span>
          <div class="helper-creds">
            User: <code>admin</code> | Pass: <code>maiifcs</code>
          </div>
        </div>
        <button type="button" class="btn-quick-fill" id="btn-quick-fill" title="Autofill login credentials">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
          </svg>
          <span>Quick Fill</span>
        </button>
      </div> -->

      <!-- Footer & TV Link -->
      <div class="card-footer">
        <a href="/tv" target="_blank" class="tv-link">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <span>Open TV Display Screen &rarr;</span>
        </a>
        <div class="system-tag">Secure Signage Control Room &bull; v1.0</div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const loginForm = document.getElementById('login-form');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const btnTogglePw = document.getElementById('btn-toggle-pw');
      const pwEyeIcon = document.getElementById('pw-eye-icon');
      const btnSubmit = document.getElementById('btn-submit');
      const btnQuickFill = document.getElementById('btn-quick-fill');
      const loginAlert = document.getElementById('login-alert');
      const alertText = document.getElementById('alert-text');

      // 1. Toggle Password Visibility
      btnTogglePw.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

        if (isPassword) {
          // Eye Slash icon
          pwEyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          `;
          btnTogglePw.setAttribute('title', 'Hide password');
        } else {
          // Normal Eye icon
          pwEyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          `;
          btnTogglePw.setAttribute('title', 'Show password');
        }
      });

      // 2. Quick Fill Demo Credentials
      btnQuickFill.addEventListener('click', () => {
        usernameInput.value = 'admin';
        passwordInput.value = 'maiifcs';
        hideAlert();
        passwordInput.focus();
      });

      // 3. Helper Functions
      function showAlert(msg) {
        alertText.textContent = msg;
        loginAlert.classList.remove('visible');
        void loginAlert.offsetWidth; // Force re-flow for animation restart
        loginAlert.classList.add('visible');
      }

      function hideAlert() {
        loginAlert.classList.remove('visible');
      }

      // Hide alert when user edits fields
      usernameInput.addEventListener('input', hideAlert);
      passwordInput.addEventListener('input', hideAlert);

      // 4. Form Submit Handler
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
          showAlert('Please enter both username and password.');
          return;
        }

        // Set Loading State
        btnSubmit.disabled = true;
        btnSubmit.classList.add('loading');

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            // Success! Store token in localStorage as backup if needed
            if (data.token) {
              localStorage.setItem('admin_token', data.token);
            }

            // Redirect to admin or redirect URL
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect') || '/admin';
            window.location.href = redirectUrl;
          } else {
            showAlert(data.error || 'Invalid credentials. Please verify username and password.');
            passwordInput.select();
            btnSubmit.disabled = false;
            btnSubmit.classList.remove('loading');
          }
        } catch (err) {
          console.error('Login request error:', err);
          showAlert('Network error or server unreachable. Please try again.');
          btnSubmit.disabled = false;
          btnSubmit.classList.remove('loading');
        }
      });

      // 5. Check if already logged in
      fetch('/api/auth/me')
        .then(res => res.json())
        .then(data => {
          if (data.authenticated) {
            window.location.href = '/admin';
          }
        })
        .catch(() => { });
    })();
  </script>
</body>

</html>
